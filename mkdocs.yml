site_name: The Principal Engineer Handbook
site_description: Manuscript and publishing site for The Principal Engineer Handbook.
repo_name: The Principal Engineer Handbook
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false

nav:
  - Home: index.md
  - Manuscript:
      - Overview: manuscript/index.md
      - Front Matter: manuscript/front-matter.md
      - Manifesto: manuscript/00-front-matter/manifesto.md
      - Preface: manuscript/00-front-matter/preface.md
      - Table of Contents: manuscript/00-front-matter/table-of-contents.md
      - Chapters:
          - Overview: manuscript/chapters/index.md
          - Part I - Thinking Like a Principal Engineer:
              - What Is a Principal Engineer?: manuscript/01-thinking-like-a-principal/01-what-is-a-principal-engineer.md
              - Decision-Making Under Constraints: manuscript/01-thinking-like-a-principal/02-decision-making-under-constraints.md
              - Asking Better Engineering Questions: manuscript/01-thinking-like-a-principal/03-asking-better-engineering-questions.md
              - Ownership Beyond Code: manuscript/01-thinking-like-a-principal/04-ownership-beyond-code.md
              - Technical Judgment and Evidence: manuscript/01-thinking-like-a-principal/05-technical-judgment-and-evidence.md
              - Leaving Systems Better Than You Found Them: manuscript/01-thinking-like-a-principal/06-leaving-systems-better-than-you-found-them.md
          - Part II - The Laws:
              - Every State Has One Owner: manuscript/02-the-laws/07-every-state-has-one-owner.md
              - Every API Is a Promise: manuscript/02-the-laws/08-every-api-is-a-promise.md
              - Every Dependency Is a Decision: manuscript/02-the-laws/09-every-dependency-is-a-decision.md
              - Time Is a Dependency: manuscript/02-the-laws/10-time-is-a-dependency.md
